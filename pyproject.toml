[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memory-layer"
version = "2.0.0"
description = "Persistent memory for AI coding agents with outcome-based learning"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Memory Layer Team" }
]
keywords = ["ai", "memory", "coding-agents", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "aiosqlite>=0.19.0",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "watchdog>=3.0.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# Core only - minimal dependencies for storage, retrieval, engine
# (base dependencies are enough)

# Embedding - sentence transformers for semantic search
embedding = [
    "sentence-transformers>=2.2.0",
]

# Extraction - LLM-based memory extraction
extraction = [
    "anthropic>=0.18.0",
]

# Server - REST API and MCP server
server = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "mcp>=1.0.0",
    "rich>=13.0.0",
]

# Full installation - everything
all = [
    "memory-layer[embedding,extraction,server]",
]

# Legacy aliases for backward compatibility
phase1 = [
    "memory-layer[embedding,extraction]",
]
phase2 = [
    "memory-layer[server]",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
    "pre-commit>=3.6.0",
    "httpx>=0.25.0",
]

[project.scripts]
mem = "memory_layer.cli.main:cli"

[project.urls]
Homepage = "https://github.com/runtimenoteslabs/memory-layer"
Documentation = "https://github.com/runtimenoteslabs/memory-layer#readme"
Repository = "https://github.com/runtimenoteslabs/memory-layer"
Issues = "https://github.com/runtimenoteslabs/memory-layer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_layer"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "security: marks tests as security tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # Pylint
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.isort]
known-first-party = ["memory_layer"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
exclude = [
    "tests/",
]

[[tool.mypy.overrides]]
module = [
    "sentence_transformers.*",
    "anthropic.*",
    "mcp.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'

[tool.coverage.run]
source = ["src/memory_layer"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 90
