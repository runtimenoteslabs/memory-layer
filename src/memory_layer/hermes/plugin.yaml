name: memorylayer
version: 1.0.0
description: "Memory Layer - local SQLite memory with hybrid retrieval and outcome-based learning, shared across Claude Code, MCP clients and Hermes."

# Left empty on purpose until this package is published to PyPI. Hermes checks
# each entry by importing `dist_name.replace("-", "_")` unless it has a mapping
# for it, so declaring "memory-layer-ai" would look for `memory_layer_ai` and
# report the provider as broken even when it is installed correctly. Hermes
# carries the same mapping for its bundled providers (honcho-ai -> honcho,
# mem0ai -> mem0), so publishing needs a one-line upstream addition of
# memory-layer-ai -> memory_layer alongside filling this in.
pip_dependencies: []

requires_env: []
hooks:
  - on_session_end
